# Shipped preset. The same review as claude-review, on `codex exec`. The
# Starters leave it out of the Gate, so it only advises, and its Findings
# still reach Fix. It runs on your own Codex login. `auth: api_key` runs it
# on the OPENAI_API_KEY Secret instead. Codex reports tokens, so the model
# is named here for slopwatch to price them.
# It runs the `codex` executable set under Settings, CLIs. A `cli` key
# here overrides that for this Step, but the Pipeline is committed, so a
# path in it only exists on your machine.
uses: codex
with:
  model: gpt-5.4
  auth: subscription
  fail_on: error
  prompt: >-
    Look for bugs, security problems, data loss, broken error handling and
    changes that don't do what the description says. Skip style nits a
    formatter or linter would catch.
