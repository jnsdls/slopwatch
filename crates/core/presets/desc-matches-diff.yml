# Shipped preset. Asks Jev whether the PR description matches the diff.
# Needs the AI_GATEWAY_API_KEY Secret.
uses: jev
with:
  questions:
    - id: does-what-it-says
      question: Does the diff do what the PR description says it does?
      pass_when: true
    - id: unmentioned-changes
      question: Does the diff change things the PR description doesn't mention?
      pass_when: false
    - id: says-why
      question: Does the PR description say why the change is needed?
      pass_when: true
