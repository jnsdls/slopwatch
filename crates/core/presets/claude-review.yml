# Shipped preset. Runs `claude -p` as a reviewer in a checkout of the PR's
# head, with read-only tools.
# It reports Findings by severity and fails on any `error` one. It runs on
# your own Claude login. `auth: api_key` runs it on the ANTHROPIC_API_KEY
# Secret instead. The PR's own hooks and MCP servers stay off unless you
# add `repo_config: true`.
# It runs the `claude` executable set under Settings, CLIs. A `cli` key
# here overrides that for this Step, but the Pipeline is committed, so a
# path in it only exists on your machine.
uses: claude
with:
  model: opus
  auth: subscription
  fail_on: error
  prompt: >-
    Look for bugs, security problems, data loss, broken error handling and
    changes that don't do what the description says. Skip style nits a
    formatter or linter would catch.
