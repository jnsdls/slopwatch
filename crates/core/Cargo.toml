[package]
name = "slopwatch-core"
description = "Framework-free domain model: the Pipeline, the Gate, Conditions and the reuse key."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
# 0.x, so pinned exactly; a bump has to pass tests/round_trip.rs (ADR 0007).
yaml-edit = { version = "=0.3.2", default-features = false }
# yaml-edit's tree, for the byte ranges of its nodes. Moves with yaml-edit.
rowan = "=0.16.1"

[lints]
workspace = true
