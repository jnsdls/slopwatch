<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Pipeline graph view and editor</title>
<!--
  PROTOTYPE, throwaway. Lives on the prototype/pipeline-graph-editor branch, never main.
  Question (issue #13): what should viewing and editing a Pipeline look like, so that order,
  parallelism, loops and the Gate read at a glance?
  Three structurally different variants, switchable via ?variant=A|B|C or the bottom bar (← →).
  The real client is GPUI; this is HTML only to react to layout and information hierarchy.
  The Run simulator is a toy that follows ADR 0006 closely enough to drive the view.
-->
<style>
:root{
  --bg:#0f1115;--panel:#161a20;--panel2:#1c2129;--line:#2a313b;--text:#d8dee6;--dim:#8a95a3;--muted:#5d6672;
  --pass:#3fb950;--fail:#f85149;--inc:#e3a33b;--err:#c678dd;--run:#58a6ff;--ask:#e3a33b;--waived:#39c5bb;--accent:#a78bfa;
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--text);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
button{cursor:pointer}button:hover{border-color:var(--dim)}
button.primary{background:#2d2560;border-color:var(--accent)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.dim{color:var(--dim)}.muted{color:var(--muted)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand b{font-weight:600}.proto{font-size:10px;letter-spacing:.08em;background:#5a1d1d;color:#ffb4b4;padding:1px 6px;border-radius:4px;margin-left:6px}
.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:#2b3442;border-color:var(--dim)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.pill.pass{background:#12301a;color:var(--pass);border-color:#23582f}
.pill.fail{background:#3a1416;color:var(--fail);border-color:#6b2427}
.pill.pending{background:#2f2610;color:var(--inc);border-color:#5e4a18}
.pill.none{color:var(--dim)}
.draft{font-size:12px;color:var(--dim)}.draft b{color:var(--accent)}
#banner .err{background:#3a1416;color:#ffc1bd;padding:6px 14px;border-bottom:1px solid #6b2427}
main{flex:1;overflow:auto;position:relative}
#yaml{position:fixed;right:14px;top:54px;width:430px;max-height:70vh;overflow:auto;background:#0b0d10;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre;z-index:20;box-shadow:0 10px 30px #0008}
#yaml h5{margin:0 0 6px;color:var(--dim);font-weight:500;font-family:inherit}
.chip{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;background:#232a34;color:#b9c3cf;border:1px solid var(--line);white-space:nowrap}
.chip.cond{background:#1d1a33;border-color:#3d3570;color:#c8bcff}
.chip.adv{border-style:dashed;color:var(--dim);background:transparent}
.chip.write{background:#33240f;border-color:#6a4a17;color:#f0c27a}
.chip.req{background:#14262c;border-color:#24505a;color:#8fd3e0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted);flex:none}
.st-pass .dot,.dot.pass,.dot.T{background:var(--pass)}.st-fail .dot,.dot.fail,.dot.F{background:var(--fail)}
.st-inconclusive .dot{background:var(--inc)}.st-error .dot,.st-missing .dot{background:var(--err)}
.st-run .dot{background:var(--run);animation:pulse 1s infinite}.st-ask .dot{background:var(--ask);animation:pulse 1s infinite}
.st-waived .dot{background:var(--waived)}.st-skipped .dot,.st-cancelled .dot{background:transparent;border:1.5px solid var(--muted)}
.dot.U{background:transparent;border:1.5px dashed var(--inc)}
@keyframes pulse{50%{opacity:.35}}
.vlabel{font-size:11px;font-weight:600;text-transform:lowercase}
.st-pass .vlabel{color:var(--pass)}.st-fail .vlabel{color:var(--fail)}.st-inconclusive .vlabel{color:var(--inc)}
.st-error .vlabel,.st-missing .vlabel{color:var(--err)}.st-run .vlabel{color:var(--run)}.st-ask .vlabel{color:var(--ask)}
.st-waived .vlabel{color:var(--waived)}.st-skipped .vlabel,.st-cancelled .vlabel,.st-wait .vlabel{color:var(--muted)}
/* inspector (shared content, placement differs per variant) */
.insp{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.insp h3{margin:0;font-size:15px}.insp .sub{color:var(--dim);font-size:12px}
.insp label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.insp label.f>*{text-transform:none;letter-spacing:0;color:var(--text);font-size:13px}
.insp .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.insp .checks label{display:inline-flex;gap:4px;align-items:center;margin-right:8px;font-size:12px;color:var(--text)}
.insp .sim{border:1px dashed #5a1d1d;border-radius:6px;padding:8px}
.insp .sim .t{font-size:10px;color:#ffb4b4;letter-spacing:.06em;margin-bottom:4px}
.libitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.gtable{width:100%;border-collapse:collapse}.gtable td{padding:4px 2px;border-bottom:1px solid var(--line)}
/* switcher */
#switcher{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#fff;color:#111;border-radius:999px;padding:6px 10px;box-shadow:0 6px 24px #000a;z-index:50;font-weight:600}
#switcher button{background:#111;color:#fff;border:none;border-radius:999px;width:28px;height:28px;padding:0}

/* ---------- Variant A: canvas ---------- */
.a-wrap{display:flex;height:100%}
.a-canvas{flex:1;overflow:auto;position:relative;background-image:radial-gradient(#252b34 1px,transparent 1px);background-size:18px 18px}
.a-tool{position:sticky;top:10px;left:10px;z-index:5;display:inline-flex;gap:6px;margin:10px}
.a-side{width:330px;border-left:1px solid var(--line);background:var(--panel);overflow:auto}
.a-node{position:absolute;width:190px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.a-node.sel{outline:2px solid var(--accent);outline-offset:2px}
.a-node.adv{border-style:dashed;background:#13161b;opacity:.85}
.a-node .top{display:flex;align-items:center;gap:6px}.a-node .id{font-weight:600}
.a-node .uses{font-size:11px;color:var(--dim)}
.a-node.st-pass{border-color:#23582f}.a-node.st-fail{border-color:#6b2427}.a-node.st-run{border-color:#1f4a7a}.a-node.st-ask{border-color:#5e4a18}
.a-node.st-skipped,.a-node.st-cancelled,.a-node.st-wait{opacity:.6}
.a-gate{position:absolute;width:210px;background:#17142a;border:2px solid #3d3570;border-radius:14px;padding:10px;cursor:pointer}
.a-gate.sel{outline:2px solid var(--accent);outline-offset:2px}
.a-gate.g-pass{border-color:var(--pass)}.a-gate.g-fail{border-color:var(--fail)}.a-gate.g-pending{border-color:var(--inc)}
.a-gate h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;color:#c8bcff}
.term{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0}
.term .acc{color:var(--dim);font-size:11px}
.orbox{border-left:2px solid #3d3570;padding-left:8px;margin:3px 0}
.orbox .lbl,.andlbl{font-size:10px;color:var(--dim);letter-spacing:.08em}
.a-loop{position:absolute;font-size:11px;color:#f0c27a;white-space:nowrap}

/* ---------- Variant B: stages ---------- */
.b-wrap{display:flex;flex-direction:column;height:100%}
.b-top{flex:1;display:flex;gap:0;overflow:auto;padding:16px;align-items:stretch}
.b-col{display:flex;flex-direction:column;gap:8px;padding:0 10px;min-width:210px}
.b-col h4{margin:0 0 2px;font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.b-arrow{align-self:center;color:var(--muted);font-size:20px;padding:0 2px}
.b-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:7px 10px;cursor:pointer;width:210px}
.b-card.sel{outline:2px solid var(--accent)}
.b-card.st-pass{border-left-color:var(--pass)}.b-card.st-fail{border-left-color:var(--fail)}.b-card.st-run{border-left-color:var(--run)}
.b-card.st-ask{border-left-color:var(--ask)}.b-card.st-waived{border-left-color:var(--waived)}.b-card.st-inconclusive{border-left-color:var(--inc)}.b-card.st-error{border-left-color:var(--err)}
.b-card .l1{display:flex;justify-content:space-between;align-items:center;gap:6px}.b-card .id{font-weight:600}
.b-card .l2{font-size:11px;color:var(--dim);margin-top:2px}
.b-card .l3{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.b-gate{min-width:260px;background:#17142a;border:2px solid #3d3570;border-radius:14px;padding:12px 14px;cursor:pointer;align-self:flex-start}
.b-gate.sel{outline:2px solid var(--accent)}
.b-gate.g-pass{border-color:var(--pass)}.b-gate.g-fail{border-color:var(--fail)}.b-gate.g-pending{border-color:var(--inc)}
.b-gate .big{font-size:22px;font-weight:700;letter-spacing:.1em;color:#c8bcff;display:flex;justify-content:space-between;align-items:center}
.b-gate .foot{margin-top:10px;font-size:11px;color:var(--dim)}
.b-lane{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.b-lane.pass{border-color:#23582f}.b-lane.fail{border-color:#6b2427}
.b-lane h5{margin:0;font-size:11px;font-weight:500}
.b-adv{border-top:1px dashed var(--line);padding:10px 26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#121418}
.b-adv h4{margin:0;font-size:11px;color:var(--dim);font-weight:500;width:100%}
.b-drawer{border-top:1px solid var(--line);background:var(--panel);height:240px;overflow:auto}
.b-drawer .insp{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.b-drawer .insp>*{min-width:200px}
.b-add{border:1px dashed var(--line);border-radius:8px;color:var(--dim);background:transparent;width:210px;text-align:left}

/* ---------- Variant C: timeline ---------- */
.c-wrap{padding:14px 14px 80px}
.c-grid{display:grid;grid-template-columns:400px 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.c-head{display:contents}.c-head>div{position:sticky;top:0;background:var(--panel2);padding:6px 10px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--line);z-index:2}
.c-left{padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:6px;min-height:40px}
.c-left.sel,.c-left.sel+.c-right{background:#1f1b33}
.c-left .id{font-weight:600}.c-left .uses{color:var(--dim);font-size:11px}
.c-left .after{color:var(--muted);font-size:11px}
.c-right{position:relative;border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:40px}
.c-sep{grid-column:1/-1;padding:5px 10px;font-size:11px;color:var(--dim);background:#121418;border-bottom:1px solid var(--line);letter-spacing:.04em}
.c-bar{position:absolute;top:11px;height:18px;border-radius:4px;font-size:10px;padding:1px 6px;color:#0b0d10;font-weight:700;overflow:hidden;white-space:nowrap}
.c-bar.pass{background:var(--pass)}.c-bar.fail{background:var(--fail)}.c-bar.inconclusive{background:var(--inc)}.c-bar.error,.c-bar.missing{background:var(--err)}
.c-bar.waived{background:var(--waived)}.c-bar.cancelled{background:#444b55;color:#bbb}
.c-bar.run{background:repeating-linear-gradient(45deg,#1f4a7a,#1f4a7a 6px,#2a5f9a 6px,#2a5f9a 12px);color:#cfe3ff}
.c-bar.ask{background:repeating-linear-gradient(45deg,#5e4a18,#5e4a18 6px,#76601f 6px,#76601f 12px);color:#ffe2a8}
.c-wait{position:absolute;top:19px;height:0;border-top:1.5px dotted var(--muted)}
.c-skip{position:absolute;top:12px;font-size:11px;color:var(--muted)}
.c-ghost .c-bar{opacity:.4}
.c-vline{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed;pointer-events:none;z-index:1}
.c-gaterow .c-left{background:#17142a}
.c-band{position:absolute;top:8px;height:24px;border-radius:5px}
.c-band.U{background:repeating-linear-gradient(45deg,#2f2610,#2f2610 6px,#3b3014 6px,#3b3014 12px)}
.c-band.T{background:#12301a;border:1px solid var(--pass)}.c-band.F{background:#3a1416;border:1px solid var(--fail)}
.c-inline{grid-column:1/-1;background:#13111f;border-bottom:1px solid var(--line)}
.c-inline .insp{flex-direction:row;flex-wrap:wrap}.c-inline .insp>*{min-width:180px}
.c-adv .c-left{opacity:.75}
.c-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}
</style>
</head>
<body>
<header id="hdr"></header>
<div id="banner"></div>
<main id="main"></main>
<div id="yaml" hidden></div>
<div id="switcher"></div>
<script>
// ---------------------------------------------------------------- data
const LIB = [
  {uses:'ci', plugin:'ci', title:'Wait for GitHub checks'},
  {uses:'lib/desc-matches-issue', plugin:'jev', title:'Jev: description matches the linked issue'},
  {uses:'lib/agent-review', plugin:'claude', title:'Agent review (Claude Code)'},
  {uses:'lib/docs-check', plugin:'jev', title:'Jev: docs updated with behaviour changes'},
  {uses:'lib/slop-check', plugin:'jev', title:'Jev: no AI slop in comments and docs'},
  {uses:'lib/security-review', plugin:'codex', title:'Security pass (Codex)'},
  {uses:'human', plugin:'human', title:'Human Step: approve or reject'},
  {uses:'merge', plugin:'merge', title:'Merge (queues if the base has a merge queue)'},
  {uses:'lib/fix', plugin:'fix', title:'Fix: an agent commits a fix', write:true},
];
const libOf = u => LIB.find(l => l.uses === u) || {uses:u, plugin:u, title:u};

let P = {
  order:['ci','desc','slop','review','security','docs','human','merge','fix'],
  steps:{
    ci:      {uses:'ci', needs:[], when:null, with:{}},
    desc:    {uses:'lib/desc-matches-issue', needs:[], when:null, with:{}},
    slop:    {uses:'lib/slop-check', needs:[], when:null, with:{}},
    review:  {uses:'lib/agent-review', needs:['ci'], when:null, with:{model:'opus'}},
    security:{uses:'lib/security-review', needs:['ci'], when:{t:'always'}, with:{}},
    docs:    {uses:'lib/docs-check', needs:[], when:{t:'files', v:'docs/**'}, with:{}},
    human:   {uses:'human', needs:['ci'], when:null, with:{prompt:'Ship it?'}},
    merge:   {uses:'merge', needs:['gate'], when:{t:'gate'}, with:{}},
    fix:     {uses:'lib/fix', needs:['gate'], when:{t:'notgate'}, with:{}},
  },
  gate:[{ref:'ci'}, {ref:'desc'}, {ref:'docs', accept:['pass','skipped']}, {or:[{ref:'review'}, {ref:'human'}]}],
};

const SCEN = {
  green:{name:'Agent review passes, merges', facts:{files:['src/app.ts'], labels:[]},
    script:{ci:{r:'pass',d:4}, desc:{r:'pass',d:1}, slop:{r:'fail',d:2}, review:{r:'pass',d:5}, security:{r:'pass',d:7}, human:{r:'hang',d:1}, merge:{r:'pass',d:1}}},
  reject:{name:'Review fails, you reject, Fix pushes', facts:{files:['src/app.ts','docs/api.md'], labels:[]},
    script:{ci:{r:'pass',d:4}, desc:{r:'pass',d:1}, slop:{r:'pass',d:2}, review:{r:'fail',d:5}, security:{r:'pass',d:6}, docs:{r:'pass',d:3}, human:{r:'fail',d:8}, fix:{r:'pass',d:4}}},
  red:{name:'CI red, Fix pushes', facts:{files:['src/app.ts'], labels:[]},
    script:{ci:{r:'fail',d:4}, desc:{r:'pass',d:1}, slop:{r:'pass',d:2}, security:{r:'inconclusive',d:6}, fix:{r:'pass',d:4}}},
  hang:{name:'desc hangs, Gate stays pending', facts:{files:['src/app.ts'], labels:[]},
    script:{ci:{r:'pass',d:4}, desc:{r:'hang',d:1}, slop:{r:'pass',d:2}, review:{r:'pass',d:5}, security:{r:'pass',d:5}, human:{r:'hang',d:1}}},
};

const qs = new URLSearchParams(location.search);
const VARIANTS = ['A','B','C'];
const VNAMES = {A:'Node canvas', B:'Stages around the Gate', C:'Timeline outline'};
let S = {variant: VARIANTS.includes(qs.get('variant')) ? qs.get('variant') : 'A',
  mode:'edit', scen:'green', t:0, sel:null, yaml:false, edits:0, waivers:{}, playing:null, frames:[]};

// ---------------------------------------------------------------- model helpers
const gateRefs = () => P.gate.flatMap(t => t.or ? t.or.map(x => x.ref) : [t.ref]);
const isWrite = id => !!libOf(P.steps[id].uses).write;
const isMerge = id => libOf(P.steps[id].uses).plugin === 'merge';
function afterGate(id, seen = {}){
  if (seen[id]) return false; seen[id] = 1;
  const s = P.steps[id]; if (!s) return false;
  return s.needs.some(n => n === 'gate' || afterGate(n, seen));
}
const inGate = id => gateRefs().includes(id);
const isAdvisory = id => !inGate(id) && !afterGate(id);
function gateRole(id){
  for (const t of P.gate){
    if (t.or && t.or.some(x => x.ref === id)) return 'or';
    if (t.ref === id) return t.accept ? 'req-skip' : 'req';
  }
  return 'none';
}
function setGateRole(id, role){
  P.gate = P.gate.filter(t => t.ref !== id).map(t => t.or ? {or:t.or.filter(x => x.ref !== id)} : t).filter(t => !t.or || t.or.length);
  if (role === 'req') P.gate.push({ref:id});
  if (role === 'req-skip') P.gate.push({ref:id, accept:['pass','skipped']});
  if (role === 'or'){ const g = P.gate.find(t => t.or); g ? g.or.push({ref:id}) : P.gate.push({or:[{ref:id}]}); }
}
function depths(){
  const memo = {}, vis = {};
  const d = id => {
    if (id in memo) return memo[id]; if (vis[id]) return 0; vis[id] = 1;
    const deps = id === 'gate' ? gateRefs().filter(r => P.steps[r]) : P.steps[id].needs.filter(n => n === 'gate' || P.steps[n]);
    const v = deps.length ? Math.max(...deps.map(x => d(x) + 1)) : 0; vis[id] = 0; return memo[id] = v;
  };
  [...P.order, 'gate'].forEach(d); return memo;
}
const condLabel = w => !w ? '' : ({always:'always', gate:'when Gate passes', notgate:'when Gate fails', files:`files: ${w.v}`, label:`label: ${w.v}`, false:'off'})[w.t];

function validate(){
  const errs = [];
  P.order.forEach(id => P.steps[id].needs.forEach(n => { if (n !== 'gate' && !P.steps[n]) errs.push(`${id} needs unknown Step ${n}`); }));
  if (!gateRefs().length) errs.push('the Gate references no Steps');
  gateRefs().forEach(r => {
    if (!P.steps[r]) errs.push(`the Gate references unknown Step ${r}`);
    else if (isWrite(r)) errs.push(`the Gate references ${r}, a write Step`);
  });
  const color = {};
  const deps = id => id === 'gate' ? gateRefs().filter(r => P.steps[r]) : P.steps[id].needs.filter(n => n === 'gate' || P.steps[n]);
  const dfs = (id, path) => {
    if (color[id] === 1){ errs.push(`cycle: ${[...path.slice(path.indexOf(id)), id].join(' → ')}`); return; }
    if (color[id] === 2) return; color[id] = 1;
    deps(id).forEach(n => dfs(n, [...path, id])); color[id] = 2;
  };
  [...P.order, 'gate'].forEach(id => dfs(id, []));
  P.order.forEach(id => {
    const s = P.steps[id];
    if (s.when && ['gate','notgate'].includes(s.when.t) && !s.needs.includes('gate')) errs.push(`${id}'s Condition reads the Gate, but ${id} doesn't need gate`);
    if (isMerge(id) && !afterGate(id)) errs.push(`${id} is a Merge Step that isn't downstream of the Gate`);
  });
  return [...new Set(errs)];
}

// ---------------------------------------------------------------- toy Run simulator (ADR 0006 semantics)
function script(id){ return {r:'pass', d:2, ...(SCEN[S.scen].script[id] || {})}; }
function simulate(){
  if (validate().length) return [];
  const st = {}; P.order.forEach(id => st[id] = {s:'wait'});
  const gate = {v:'U', at:null}; let end = null; const frames = [];
  const settled = id => ['done','skipped','cancelled'].includes(st[id].s);
  const eff = id => (st[id].s === 'done' && st[id].v !== 'pass' && S.waivers[id]) ? 'pass' : st[id].v;
  const term = t => {
    if (t.or){ const vs = t.or.map(term); return vs.includes('T') ? 'T' : vs.every(v => v === 'F') ? 'F' : 'U'; }
    if (!settled(t.ref)) return 'U';
    return (t.accept || ['pass']).includes(eff(t.ref)) ? 'T' : 'F';
  };
  const evalGate = () => { const vs = P.gate.map(term); return vs.includes('F') ? 'F' : vs.every(v => v === 'T') ? 'T' : 'U'; };
  const facts = SCEN[S.scen].facts;
  const cond = id => {
    const s = P.steps[id], w = s.when;
    if (!w) return s.needs.every(n => n === 'gate' ? gate.v === 'T' : eff(n) === 'pass');
    if (w.t === 'always') return true;
    if (w.t === 'gate') return gate.v === 'T';
    if (w.t === 'notgate') return gate.v === 'F';
    if (w.t === 'files'){ const pre = (w.v || '').replace(/\*.*$/, ''); return facts.files.some(f => f.startsWith(pre)); }
    if (w.t === 'label') return facts.labels.includes(w.v);
    return false;
  };
  for (let t = 0; t <= 30; t++){
    P.order.forEach(id => { const s = st[id]; if (s.s === 'run' && s.end <= t){ s.s = 'done'; s.v = script(id).r; } });
    let changed = true;
    while (changed){
      changed = false;
      if (gate.at === null){ const g = evalGate(); if (g !== 'U'){ gate.v = g; gate.at = t; changed = true; } }
      P.order.forEach(id => {
        const s = st[id]; if (s.s !== 'wait') return;
        const ready = P.steps[id].needs.every(n => n === 'gate' ? gate.at !== null : !P.steps[n] || settled(n));
        if (!ready) return; changed = true;
        if (cond(id)){ const sc = script(id); s.s = 'run'; s.start = t; s.end = sc.r === 'hang' ? Infinity : t + Math.max(1, +sc.d || 1); }
        else { s.s = 'skipped'; s.v = 'skipped'; s.start = s.end = t; }
      });
    }
    const doneNow = P.order.filter(id => st[id].s === 'done' && st[id].end === t);
    if (doneNow.some(id => isMerge(id) && st[id].v === 'pass')) end = {reason:'merged', t};
    else if (doneNow.some(id => isWrite(id) && st[id].v === 'pass')) end = {reason:'pushed', t};
    else if (P.order.every(settled)) end = {reason: gate.v === 'T' ? 'shippable' : 'not shippable', t};
    if (end) P.order.forEach(id => { const s = st[id]; if (!settled(id)){ s.s = 'cancelled'; s.v = 'cancelled'; if (s.start === undefined) s.start = t; s.end = t; } });
    frames.push(JSON.parse(JSON.stringify({t, st, gate, end})));
    if (end) break;
  }
  return frames;
}
const frame = () => S.frames[Math.min(S.t, S.frames.length - 1)];
const finalFrame = () => S.frames[S.frames.length - 1];
function liveFrame(){ return S.mode === 'live' ? frame() : null; }

function stepStatus(id, fr){
  if (!fr) return {cls:'idle', label:''};
  const s = fr.st[id]; if (!s) return {cls:'idle', label:''};
  if (s.s === 'wait') return {cls:'wait', label:'waiting'};
  if (s.s === 'run') return P.steps[id].uses === 'human' ? {cls:'ask', label:'waiting on you'} : {cls:'run', label:'running'};
  if (s.s === 'done' && s.v !== 'pass' && S.waivers[id]) return {cls:'waived', label:`${s.v} · waived`};
  return {cls:s.v, label:s.v};
}
function termVal(t, fr){
  if (!fr) return null;
  if (t.or){ const vs = t.or.map(x => termVal(x, fr)); return vs.includes('T') ? 'T' : vs.every(v => v === 'F') ? 'F' : 'U'; }
  const s = fr.st[t.ref]; if (!s || !['done','skipped','cancelled'].includes(s.s)) return 'U';
  const v = (s.s === 'done' && s.v !== 'pass' && S.waivers[t.ref]) ? 'pass' : s.v;
  return (t.accept || ['pass']).includes(v) ? 'T' : 'F';
}
function gateState(fr){
  if (!fr) return {cls:'none', label:'not running'};
  const v = fr.gate.at !== null && fr.gate.at <= fr.t ? fr.gate.v : 'U';
  const waived = v === 'T' && Object.keys(S.waivers).some(inGate);
  return {T:{cls:'pass', label: waived ? 'pass (waived)' : 'pass'}, F:{cls:'fail', label:'fail'}, U:{cls:'pending', label:'pending'}}[v];
}

// ---------------------------------------------------------------- YAML (what publishing would write)
function yaml(){
  const w = Math.max(...P.order.map(i => i.length)) + 1;
  const fmt = v => /[\s:#?*]/.test(v) ? JSON.stringify(v) : v;
  const cy = c => ({always:'always', gate:'gate', notgate:'{ not: [gate] }', files:`{ files: ${JSON.stringify(c.v || '')} }`, label:`{ labels: ${fmt(c.v || '')} }`, false:'false'})[c.t];
  let o = 'version: 1\nsteps:\n';
  P.order.forEach(id => {
    const s = P.steps[id], parts = [`uses: ${s.uses}`];
    if (s.needs.length) parts.push(`needs: [${s.needs.join(', ')}]`);
    const kv = Object.entries(s.with).filter(([, v]) => v !== '');
    if (kv.length) parts.push(`with: { ${kv.map(([k, v]) => `${k}: ${fmt(v)}`).join(', ')} }`);
    if (s.when) parts.push(`when: ${cy(s.when)}`);
    o += `  ${(id + ':').padEnd(w)} { ${parts.join(', ')} }\n`;
  });
  const ty = (t, inFlow) => t.accept ? (inFlow ? `{ ${t.ref}: [${t.accept.join(', ')}] }` : `${t.ref}: [${t.accept.join(', ')}]`) : t.ref;
  o += 'gate:\n';
  P.gate.forEach(t => o += t.or ? `  - or: [${t.or.map(x => ty(x, true)).join(', ')}]\n` : `  - ${ty(t)}\n`);
  return o;
}

  const g = live ? gateState(fr) : {cls:'none', label:'dry run'};
  const gAt = fr && fr.gate.at !== null && fr.gate.at <= (live ? tNow : Infinity) ? fr.gate.at : null;
  const gEnd = live ? tNow : maxT;
  const gateRow = `<div class="c-left ${S.sel === 'gate' ? 'sel' : ''}" data-act="sel" data-v="gate"><div><b style="letter-spacing:.1em;color:#c8bcff">GATE</b> <span class="pill ${g.cls}">${g.label}</span>
      <div class="after mono">${P.gate.map(t => t.or ? `any(${t.or.map(x => x.ref).join(', ')})` : t.ref + (t.accept ? '·skip ok' : '')).join(' ∧ ')}</div></div></div>
    <div class="c-right ${live ? '' : 'c-ghost'}">${fr ? `<div class="c-band U" style="left:${x(0)}px;width:${x(gAt ?? Math.min(gEnd, maxT)) - x(0)}px;${live ? '' : 'opacity:.4'}"></div>${gAt !== null ? `<div class="c-band ${fr.gate.v}" style="left:${x(gAt)}px;width:${x(Math.min(gEnd, maxT)) - x(gAt)}px;${live ? '' : 'opacity:.4'}"></div>` : ''}` : ''}</div>
    ${S.sel === 'gate' ? `<div class="c-inline">${inspector()}</div>` : ''}`;
  const vlines = fr ? `${gAt !== null ? `<div class="c-vline" style="left:${400 + x(gAt)}px;border-color:${fr.gate.v === 'T' ? 'var(--pass)' : 'var(--fail)'}"></div>` : ''}${live ? `<div class="c-vline" style="left:${400 + x(tNow)}px;border-color:var(--run);border-left-style:solid"></div>` : ''}` : '';
  const ticks = Array.from({length: maxT + 1}, (_, t) => `<span style="position:absolute;left:${x(t) - 3}px">${t}</span>`).join('');
  const endNote = fr && fr.end && (!live || fr.end.t <= tNow) ? `Run ends at t${fr.end.t}: <b>${fr.end.reason}</b>` : '';
  return `<div class="c-wrap">
    <div class="c-tools">${S.mode === 'edit' ? `<button data-act="sel" data-v="">+ Add Step</button><span class="dim">Bars are a dry run of “${SCEN[S.scen].name}”. Overlapping bars run in parallel.</span>` : `<span class="dim">Overlapping bars run in parallel. Dashed line: Gate determined. Blue line: now.</span>`}<span class="spacer"></span><span class="dim">${endNote}</span></div>
    ${!S.sel ? `<div style="background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px">${inspector()}</div>` : ''}
    <div class="c-grid" style="position:relative">
      <div class="c-head"><div>Step</div><div style="position:relative;height:28px">${ticks}</div></div>
      <div class="c-sep">IN THE GATE</div>${pre.map(id => row(id)).join('')}
      <div class="c-gaterow" style="display:contents">${gateRow}</div>
      <div class="c-sep">AFTER THE GATE</div>${post.map(id => row(id)).join('') || ''}
      <div class="c-sep">ADVISORY · not in the Gate</div><div class="c-adv" style="display:contents">${adv.map(id => row(id)).join('')}</div>
      ${vlines}
    </div></div>`;
}

// ---------------------------------------------------------------- shell
function header(){
  const fr = liveFrame(), g = gateState(fr);
  const n = S.frames.length - 1;
  const endPill = fr && fr.end ? `<span class="pill ${fr.end.reason === 'merged' || fr.end.reason === 'shippable' ? 'pass' : fr.end.reason === 'pushed' ? 'pending' : 'fail'}">Run ended: ${fr.end.reason}</span>` : '';
  return `<div class="brand"><b>slopwatch</b> <span class="dim">acme/web › Pipeline</span><span class="proto">PROTOTYPE</span></div>
    <div class="seg"><button data-act="mode" data-v="edit" class="${S.mode === 'edit' ? 'on' : ''}">Edit</button><button data-act="mode" data-v="live" class="${S.mode === 'live' ? 'on' : ''}">Live Run</button></div>
    <select data-f="scen">${Object.entries(SCEN).map(([k, v]) => `<option value="${k}" ${k === S.scen ? 'selected' : ''}>Scenario: ${v.name}</option>`).join('')}</select>
    ${S.mode === 'live' && n >= 0 ? `<button data-act="play">${S.playing ? '❚❚' : '▶'}</button><input type="range" min="0" max="${n}" value="${Math.min(S.t, n)}" data-f="t" style="width:140px"><span class="mono dim">t${Math.min(S.t, n)} · Run #14 · a1b2c3d</span>
      <span class="pill ${g.cls}">Gate: ${g.label}</span>${endPill}` : ''}
    <span class="spacer"></span>
    ${S.edits ? `<span class="draft"><b>Draft</b> · ${S.edits} unpublished edit${S.edits > 1 ? 's' : ''} on main@9f2c1e0 <button class="primary" data-act="publish">Publish as PR</button></span>` : `<span class="draft">main@9f2c1e0</span>`}
    <button data-act="yaml" class="${S.yaml ? 'on' : ''}">YAML</button>`;
}
function render(keepHdr){
  S.frames = simulate();
  const errs = validate();
  if (!keepHdr) document.getElementById('hdr').innerHTML = header();
  document.getElementById('banner').innerHTML = errs.length ? `<div class="err"><b>Invalid Pipeline, no Runs:</b> ${errs.map(esc).join(' · ')}</div>` : '';
  document.getElementById('main').innerHTML = ({A:renderA, B:renderB, C:renderC})[S.variant]();
  const y = document.getElementById('yaml'); y.hidden = !S.yaml; y.innerHTML = `<h5>.slopwatch/pipeline.yml${S.edits ? ' (draft)' : ''}</h5><span class="mono">${esc(yaml())}</span>`;
  document.getElementById('switcher').innerHTML = `<button data-act="vprev">←</button><span>${S.variant} (${VNAMES[S.variant]})</span><button data-act="vnext">→</button>`;
}
function setVariant(v){ S.variant = v; const u = new URL(location); u.searchParams.set('variant', v); history.replaceState(null, '', u); render(); }
const edit = f => { f(); S.edits++; render(); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (a === 'sel'){ S.sel = v || null; render(); }
  else if (a === 'mode'){ S.mode = v; if (v === 'live') S.t = 0; render(); }
  else if (a === 'yaml'){ S.yaml = !S.yaml; render(); }
  else if (a === 'vprev') setVariant(VARIANTS[(VARIANTS.indexOf(S.variant) + 2) % 3]);
  else if (a === 'vnext') setVariant(VARIANTS[(VARIANTS.indexOf(S.variant) + 1) % 3]);
  else if (a === 'publish') alert('Prototype: would replay the draft onto .slopwatch/pipeline.yml and open or update the slopwatch/pipeline PR.');
  else if (a === 'play'){
    if (S.playing){ clearInterval(S.playing); S.playing = null; render(); return; }
    if (S.t >= S.frames.length - 1) S.t = 0;
    S.playing = setInterval(() => { if (S.t >= S.frames.length - 1){ clearInterval(S.playing); S.playing = null; } else S.t++; render(); }, 600); render();
  }
  else if (a === 'add') edit(() => {
    let base = v.split('/').pop().split('-')[0], nid = base, i = 2; while (P.steps[nid]) nid = base + i++;
    P.steps[nid] = {uses:v, needs: v === 'merge' || v === 'lib/fix' ? ['gate'] : [], when: v === 'merge' ? {t:'gate'} : v === 'lib/fix' ? {t:'notgate'} : null, with:{}};
    const at = P.order.findIndex(afterGate); at < 0 ? P.order.push(nid) : P.order.splice(at, 0, nid); S.sel = nid;
  });
  else if (a === 'del') edit(() => { delete P.steps[v]; P.order = P.order.filter(x => x !== v); setGateRole(v, 'none'); P.order.forEach(x => P.steps[x].needs = P.steps[x].needs.filter(n => n !== v)); S.sel = null; });
  else if (a === 'answer'){ const s = frame().st[id]; SCEN[S.scen].script[id] = {r:v, d:Math.max(1, frame().t - s.start)}; render(); }
  else if (a === 'waive'){ S.waivers[id] = {cat:document.getElementById('wcat').value, reason:document.getElementById('wreason').value || '(none)'}; render(); }
  else if (a === 'unwaive'){ delete S.waivers[id]; render(); }
  else if (a === 'override'){ const fr = frame(); gateRefs().forEach(r => { const s = fr.st[r]; if (s && s.s === 'done' && s.v !== 'pass') S.waivers[r] = {cat:'accepted_risk', reason:'Gate override'}; }); render(); }
});
document.addEventListener('change', e => {
  const el = e.target, f = el.dataset.f, id = el.dataset.id; if (!f) return;
  if (f === 't'){ render(); return; }
  if (f === 'scen'){ S.scen = el.value; S.waivers = {}; S.t = 0; render(); return; }
  if (f === 'simr' || f === 'simd'){ const sc = SCEN[S.scen].script; sc[id] = {...script(id), [f === 'simr' ? 'r' : 'd']: f === 'simr' ? el.value : +el.value}; render(); return; }
  edit(() => {
    const s = P.steps[id];
    if (f === 'uses') s.uses = el.value;
    if (f === 'with') s.with = Object.fromEntries(el.value.split(',').map(p => p.split('=').map(x => x.trim())).filter(p => p[0]).map(([k, ...r]) => [k, r.join('=')]));
    if (f === 'need') s.needs = el.checked ? [...s.needs, el.dataset.v] : s.needs.filter(n => n !== el.dataset.v);
    if (f === 'when') s.when = el.value === 'default' ? null : {t:el.value, v: el.value === 'files' ? 'docs/**' : el.value === 'label' ? 'release' : undefined};
    if (f === 'whenv') s.when.v = el.value;
    if (f === 'role') setGateRole(id, el.value);
  });
});
document.addEventListener('input', e => { if (e.target.dataset.f === 't'){ S.t = +e.target.value; render(true); } });
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowRight') setVariant(VARIANTS[(VARIANTS.indexOf(S.variant) + 1) % 3]);
  if (e.key === 'ArrowLeft') setVariant(VARIANTS[(VARIANTS.indexOf(S.variant) + 2) % 3]);
});
render();
</script>
</body>
</html>
