[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
slopwatch-core = { path = "crates/core" }
slopwatch-protocol = { path = "crates/protocol" }
slopwatch-daemon = { path = "crates/daemon" }

# ADR 0005: exact pin, and only the client crate may depend on it.
# Bump it in its own PR together with rust-toolchain.toml.
gpui-kit = "=0.7.0"

async-trait = "0.1"
block2 = "0.6"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "native-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
tungstenite = "0.30"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The daemon hashes its own executable for the built-in Plugins' reuse
# version, which takes seconds unoptimized.
[profile.dev.package.sha2]
opt-level = 3
