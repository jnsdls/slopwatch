[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
slopwatch-core = { path = "crates/core" }
slopwatch-protocol = { path = "crates/protocol" }
slopwatch-daemon = { path = "crates/daemon" }

# ADR 0005: exact pin, and only the client crate may depend on it.
# Bump it in its own PR together with rust-toolchain.toml.
gpui-kit = "=0.7.0"

futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
tungstenite = "0.30"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
